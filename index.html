<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payslip Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Payslip Generator</h1>
        <form id="payslipForm">
            <label for="employeeName">Employee Name:</label>
            <input type="text" id="employeeName" required>

            <label for="employeeID">Employee ID:</label>
            <input type="text" id="employeeID" required>

            <label for="department">Department:</label>
            <input type="text" id="department" required>

            <label for="jobTitle">Job Title:</label>
            <input type="text" id="jobTitle" required>

            <label for="regularHours">Regular Hours Worked:</label>
            <input type="number" id="regularHours" required>

            <label for="overtimeHours">Overtime Hours Worked:</label>
            <input type="number" id="overtimeHours" required>

            <label for="hourlyRate">Hourly Rate:</label>
            <input type="number" id="hourlyRate" required>

            <label for="deductions">Deductions (Taxes, Insurance, etc.):</label>
            <input type="number" id="deductions" required>

            <label for="bonuses">Bonuses:</label>
            <input type="number" id="bonuses" required>

            <button type="submit">Generate Payslip</button>
        </form>

        <div id="payslipOutput" class="payslip-output"></div>
        <button id="downloadBtn" style="display:none;">Download Payslip</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
